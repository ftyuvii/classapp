<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClassHub — Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- =========================================================
       SCREEN 1: LANDING — roll number entry (primary) + teacher link
  ========================================================== -->
  <section id="landing-screen" class="screen center">
    <div class="card">
      <div class="brand">
        <span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">ClassHub</span>
      </div>

      <h1 class="heading">Mark your presence</h1>
      <p class="subtitle">Getting starts</p>

      <form id="roll-form" class="roll-form">
        <input type="text" id="roll-input" placeholder="Roll number" inputmode="numeric" autocomplete="off" required />
        <button type="submit" class="btn-primary">Continue</button>
      </form>
      <p id="roll-error" class="error-text hidden">No student found with this roll number.</p>

      <button id="show-teacher-login" class="text-link">Teacher / Admin Login</button>
    </div>
  </section>

  <!-- =========================================================
       SCREEN 2: TEACHER / ADMIN LOGIN
  ========================================================== -->
  <section id="teacher-login-screen" class="screen center hidden">
    <div class="card">
      <button id="back-to-landing" class="back-link" aria-label="Back">← Back</button>

      <div class="brand">
        <span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">ClassHub</span>
      </div>

      <h1 class="heading">Teacher sign in</h1>
      <p class="subtitle">For faculty and admin use only</p>

      <form id="teacher-login-form" class="stack-form">
        <label for="teacher-email">Email</label>
        <input type="email" id="teacher-email" required autocomplete="username" />

        <label for="teacher-password">Password</label>
        <input type="password" id="teacher-password" required autocomplete="current-password" />

        <p id="teacher-error" class="error-text hidden"></p>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>
    </div>
  </section>

  <!-- =========================================================
       SCREEN 3: STUDENT VIEW — attendance bar (own record)
  ========================================================== -->
  <section id="student-screen" class="screen hidden">
    <header class="app-header">
      <div class="header-left">
        <span class="brand-bars small" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">ClassHub</span>
      </div>
      <button id="student-exit-btn" class="text-link">Change roll number</button>
    </header>

    <main class="main narrow">
      <p class="eyebrow" id="student-roll-label"></p>
      <h2 class="page-title" id="student-name-label"></h2>

      <div class="stat-block">
        <div class="stat-row">
          <span class="stat-label">Attendance</span>
          <span class="stat-value" id="attendance-percent">—</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
        </div>
        <div class="stat-sub" id="attendance-summary">No records yet</div>
      </div>

      <h3 class="section-label">Recent days</h3>
      <div id="history-list" class="history-list"></div>
    </main>
  </section>

  <!-- =========================================================
       SCREEN 4: TEACHER DASHBOARD — the attendance bar
  ========================================================== -->
  <section id="teacher-screen" class="screen hidden">
    <header class="app-header">
      <div class="header-left">
        <span class="brand-bars small" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">ClassHub</span>
      </div>
      <button id="teacher-logout-btn" class="text-link">Log out</button>
    </header>

    <main class="main">
      <div class="dashboard-top">
        <div>
          <h2 class="page-title">Attendance</h2>
          <p class="eyebrow" id="date-display"></p>
        </div>
        <div class="date-controls">
          <input type="date" id="date-input" />
          <button id="mark-all-present-btn" class="btn-secondary">Mark all present</button>
        </div>
      </div>

      <div class="summary-bar" id="summary-bar"></div>

      <div id="attendance-bar" class="attendance-bar"></div>
      <p class="hint-text">Click a student to cycle: unmarked → present → absent</p>
    </main>
  </section>

  <script type="module" src="script.js"></script>
</body>
</html>
